spring.application.name=personal-ai-assistant
server.port=8080

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3.5:9b
spring.ai.ollama.chat.options.temperature=0.5
# Tool calling requires higher num_predict to avoid truncation mid-response
spring.ai.ollama.chat.options.num-predict=2048

# Google integration (optional — place credentials.json in project root to enable)
google.credentials.file=credentials.json
google.tokens.directory=tokens
google.user.email=test@test.com

# Increase timeouts for tool-call round trips
spring.codec.max-in-memory-size=10MB
