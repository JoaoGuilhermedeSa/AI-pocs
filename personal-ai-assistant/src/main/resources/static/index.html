<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal AI Assistant</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2d3148;
    --accent: #6c63ff;
    --accent2: #4ecdc4;
    --text: #e8eaf6;
    --muted: #7c7f9a;
    --user-bg: #1e2a4a;
    --ai-bg: #1a1d27;
    --green: #4ade80;
    --yellow: #fbbf24;
    --red: #f87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  header h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  header h1::before { content: none; }

  .caps {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-left: auto;
  }

  .cap {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 500;
    border: 1px solid var(--border);
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .cap.active { border-color: var(--accent2); color: var(--accent2); }

  #google-status {
    font-size: 0.72rem;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  .status-ok { border-color: var(--green) !important; color: var(--green) !important; }
  .status-off { border-color: var(--yellow) !important; color: var(--yellow) !important; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message {
    display: flex;
    gap: 12px;
    max-width: 820px;
    width: 100%;
  }

  .message.user { margin-left: auto; flex-direction: row-reverse; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .message.user .avatar { background: var(--accent); }
  .message.assistant .avatar { background: var(--surface2); border: 1px solid var(--border); }

  .bubble {
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 0.93rem;
    max-width: calc(100% - 44px);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .message.user .bubble {
    background: var(--user-bg);
    border: 1px solid #2a3a6a;
    border-radius: 12px 4px 12px 12px;
  }

  .message.assistant .bubble {
    background: var(--ai-bg);
    border: 1px solid var(--border);
    border-radius: 4px 12px 12px 12px;
  }

  .thinking {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 8px 0;
  }

  .dots span {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.4s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  .tool-call {
    font-size: 0.78rem;
    color: var(--accent2);
    padding: 6px 10px;
    background: rgba(78,205,196,0.06);
    border: 1px solid rgba(78,205,196,0.2);
    border-radius: 6px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #message-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 0.93rem;
    resize: none;
    outline: none;
    min-height: 48px;
    max-height: 140px;
    font-family: inherit;
    line-height: 1.5;
    transition: border-color 0.2s;
  }

  #message-input:focus { border-color: var(--accent); }
  #message-input::placeholder { color: var(--muted); }

  #send-btn {
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    color: #fff;
    font-size: 0.93rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    height: 48px;
    white-space: nowrap;
  }

  #send-btn:hover { opacity: 0.85; }
  #send-btn:active { transform: scale(0.97); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #new-chat-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--muted);
    font-size: 0.85rem;
    cursor: pointer;
    height: 48px;
    transition: border-color 0.2s, color 0.2s;
  }

  #new-chat-btn:hover { border-color: var(--accent); color: var(--accent); }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
  }

  .empty-state h2 { font-size: 1.5rem; margin-bottom: 8px; color: var(--text); }
  .empty-state p { font-size: 0.9rem; margin-bottom: 24px; }

  .suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    max-width: 500px;
    margin: 0 auto;
  }

  .suggestion {
    padding: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.82rem;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    transition: border-color 0.2s;
  }

  .suggestion:hover { border-color: var(--accent); }
  .suggestion .icon { font-size: 1.2rem; margin-bottom: 4px; display: block; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>Personal AI Assistant</h1>
  <div class="caps">
    <span class="cap active">Calendar</span>
    <span class="cap active">Email</span>
    <span class="cap active">Tasks</span>
    <span class="cap" id="google-status">Google: checking...</span>
  </div>
</header>

<div id="messages">
  <div class="empty-state" id="empty-state">
    <h2>How can I help you?</h2>
    <p>Schedule meetings, send emails, and manage tasks through conversation.</p>
    <div class="suggestions">
      <div class="suggestion" onclick="suggest(this)">What do I have this week?</div>
      <div class="suggestion" onclick="suggest(this)">Show my latest emails</div>
      <div class="suggestion" onclick="suggest(this)">Show my pending tasks</div>
      <div class="suggestion" onclick="suggest(this)">Add a task: review project docs</div>
    </div>
  </div>
</div>

<div id="input-area">
  <button id="new-chat-btn" onclick="newChat()">+ New chat</button>
  <textarea id="message-input" placeholder="Ask me anything..." rows="1"
            onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button id="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
  let conversationId = null;
  let streaming = false;

  async function checkGoogleStatus() {
    try {
      const r = await fetch('/actuator/health');
      const data = await r.json();
      const el = document.getElementById('google-status');
      if (data.status === 'UP') {
        el.textContent = 'Google: connected';
        el.className = 'cap status-ok';
      }
    } catch {}
  }

  function suggest(el) {
    document.getElementById('message-input').value = el.textContent.trim();
    sendMessage();
  }

  function newChat() {
    conversationId = null;
    document.getElementById('messages').innerHTML = '';
    document.getElementById('messages').innerHTML = `<div class="empty-state" id="empty-state">
      <h2>How can I help you?</h2>
      <p>Schedule meetings, send emails, and manage tasks through conversation.</p>
      <div class="suggestions">
        <div class="suggestion" onclick="suggest(this)">What do I have this week?</div>
        <div class="suggestion" onclick="suggest(this)">Show my latest emails</div>
        <div class="suggestion" onclick="suggest(this)">Show my pending tasks</div>
        <div class="suggestion" onclick="suggest(this)">Add a task: review project docs</div>
      </div>
    </div>`;
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function appendMessage(role, text) {
    const empty = document.getElementById('empty-state');
    if (empty) empty.remove();

    const wrap = document.createElement('div');
    wrap.className = 'message ' + role;
    wrap.innerHTML = `
      <div class="avatar">${role === 'user' ? 'U' : 'AI'}</div>
      <div class="bubble">${escHtml(text)}</div>
    `;
    document.getElementById('messages').appendChild(wrap);
    scrollBottom();
    return wrap.querySelector('.bubble');
  }

  function appendThinking() {
    const empty = document.getElementById('empty-state');
    if (empty) empty.remove();

    const wrap = document.createElement('div');
    wrap.className = 'message assistant';
    wrap.id = 'thinking-indicator';
    wrap.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble thinking">
        Working on it <div class="dots"><span></span><span></span><span></span></div>
      </div>
    `;
    document.getElementById('messages').appendChild(wrap);
    scrollBottom();
    return wrap;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function scrollBottom() {
    const m = document.getElementById('messages');
    m.scrollTop = m.scrollHeight;
  }

  async function sendMessage() {
    if (streaming) return;
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    document.getElementById('send-btn').disabled = true;
    streaming = true;

    appendMessage('user', text);
    const thinking = appendThinking();

    try {
      const resp = await fetch('/api/assistant/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, conversationId })
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let aiBubble = null;
      let fullText = '';
      let buffer = '';
      let currentEvent = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (line.startsWith('event:')) {
            currentEvent = line.slice(6).trim();
          } else if (line.startsWith('data:')) {
            const data = line.slice(5);
            if (currentEvent === 'token') {
              if (thinking.parentNode) thinking.remove();
              if (!aiBubble) aiBubble = appendMessage('assistant', '').parentNode.querySelector('.bubble');
              fullText += data;
              aiBubble.textContent = fullText;
              scrollBottom();
            } else if (currentEvent === 'done') {
              conversationId = data;
            } else if (currentEvent === 'error') {
              if (thinking.parentNode) thinking.remove();
              appendMessage('assistant', 'Error: ' + data);
            }
            currentEvent = '';
          }
        }
      }

      // fallback: if no tokens arrived (tool-only response), remove thinking
      if (thinking.parentNode) thinking.remove();

    } catch (err) {
      if (thinking.parentNode) thinking.remove();
      appendMessage('assistant', 'Connection error: ' + err.message);
    } finally {
      document.getElementById('send-btn').disabled = false;
      streaming = false;
      document.getElementById('message-input').focus();
    }
  }

  checkGoogleStatus();
</script>
</body>
</html>
