<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Design Discussion</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d17;
      --surface: #13131f;
      --surface2: #1a1a2e;
      --border: #2a2a42;
      --text: #e2e2f0;
      --text-muted: #7070a0;
      --user-bg: #1b2a3b;
      --user-border: #2a4a6b;
      --radius: 10px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text);
      flex: 1;
    }

    header h1 span { color: var(--text-muted); font-weight: 400; }

    .btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 0.78rem;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .btn:hover { color: var(--text); border-color: #4a4a70; }

    /* ── PARTICIPANT PILLS ── */
    #participants-bar {
      display: flex;
      gap: 8px;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all .15s;
      user-select: none;
      opacity: 0.5;
    }
    .pill.active { opacity: 1; }
    .pill-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* ── MESSAGES ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .message { display: flex; flex-direction: column; gap: 6px; max-width: 820px; }

    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.ai { align-self: flex-start; align-items: flex-start; }

    .msg-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .msg-avatar {
      width: 22px; height: 22px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.65;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid transparent;
    }

    .message.user .msg-bubble {
      background: var(--user-bg);
      border-color: var(--user-border);
      color: #c8d8ea;
      border-radius: var(--radius) var(--radius) 2px var(--radius);
    }

    .message.ai .msg-bubble {
      border-radius: 2px var(--radius) var(--radius) var(--radius);
    }

    /* Participant-specific colors */
    [data-pid="ollama"] .msg-avatar  { background: #1e3d1e; color: #5dbd5d; }
    [data-pid="ollama"] .msg-bubble  { background: #141f14; border-color: #2a4a2a; color: #d4ecd4; }
    [data-pid="ollama"] .msg-name    { color: #5dbd5d; }

    [data-pid="claude"] .msg-avatar  { background: #3d2a1a; color: #e0943a; }
    [data-pid="claude"] .msg-bubble  { background: #1f1710; border-color: #4a3020; color: #ecdcc4; }
    [data-pid="claude"] .msg-name    { color: #e0943a; }

    [data-pid="gemini"] .msg-avatar  { background: #1a2c3d; color: #4aa8e0; }
    [data-pid="gemini"] .msg-bubble  { background: #101820; border-color: #20344a; color: #c4d8ec; }
    [data-pid="gemini"] .msg-name    { color: #4aa8e0; }

    /* Fallback for unknown participants */
    .msg-avatar.fallback  { background: #2a1a3d; color: #a04ae0; }
    .msg-bubble.fallback  { background: #180e22; border-color: #3a2050; color: #dcc4ec; }
    .msg-name.fallback    { color: #a04ae0; }

    /* Pill colors matching above */
    .pill[data-pid="ollama"] { border-color: #2a4a2a; }
    .pill[data-pid="ollama"] .pill-dot { background: #5dbd5d; }
    .pill[data-pid="ollama"].active { border-color: #5dbd5d; color: #5dbd5d; }

    .pill[data-pid="claude"] { border-color: #4a3020; }
    .pill[data-pid="claude"] .pill-dot { background: #e0943a; }
    .pill[data-pid="claude"].active { border-color: #e0943a; color: #e0943a; }

    .pill[data-pid="gemini"] { border-color: #20344a; }
    .pill[data-pid="gemini"] .pill-dot { background: #4aa8e0; }
    .pill[data-pid="gemini"].active { border-color: #4aa8e0; color: #4aa8e0; }

    /* Streaming cursor */
    .cursor {
      display: inline-block;
      width: 2px; height: 1em;
      background: currentColor;
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 1s step-start infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .msg-status {
      font-size: 0.7rem;
      color: var(--text-muted);
      padding: 0 4px;
    }

    /* ── INPUT AREA ── */
    footer {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.9rem;
      padding: 10px 14px;
      resize: none;
      min-height: 46px;
      max-height: 140px;
      line-height: 1.5;
      outline: none;
      transition: border-color .15s;
    }
    #input:focus { border-color: #4a4a70; }
    #input::placeholder { color: var(--text-muted); }

    #send-btn {
      padding: 10px 20px;
      background: #2a2a50;
      border: 1px solid #4a4a80;
      border-radius: var(--radius);
      color: #9090d0;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-end;
      transition: all .15s;
      white-space: nowrap;
    }
    #send-btn:hover:not(:disabled) { background: #3a3a70; color: #c0c0f0; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 8px;
      pointer-events: none;
    }
    .empty-state .icon { font-size: 2.5rem; }
    .empty-state p { font-size: 0.88rem; }
  </style>
</head>
<body>

<header>
  <h1>Game Design Discussion <span>— multi-AI debate</span></h1>
  <button class="btn" id="new-session-btn">New Session</button>
</header>

<div id="participants-bar">
  <span style="font-size:0.75rem;color:var(--text-muted);align-self:center;">Participants:</span>
</div>

<main id="messages">
  <div class="empty-state" id="empty-state">
    <div class="icon">🎮</div>
    <p>Start a game design discussion — share an idea, ask a question, or pitch a mechanic.</p>
  </div>
</main>

<footer>
  <textarea id="input" rows="1" placeholder="Share a game design take or ask a question…"></textarea>
  <button id="send-btn" disabled>Send</button>
</footer>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('input');
  const sendBtn    = document.getElementById('send-btn');
  const pillsBar   = document.getElementById('participants-bar');
  const emptyState = document.getElementById('empty-state');

  let sessionId = null;
  let participants = [];
  let activeParticipants = new Set();
  let streaming = false;
  let streamingBubbles = {}; // participantId -> { bubbleEl, contentEl, cursorEl }

  // ── Bootstrap ──────────────────────────────────────────────

  async function init() {
    const [sessRes, partRes] = await Promise.all([
      fetch('/api/discussion/sessions', { method: 'POST' }),
      fetch('/api/discussion/participants')
    ]);
    const { sessionId: sid } = await sessRes.json();
    sessionId = sid;
    participants = await partRes.json();
    renderPills();
    sendBtn.disabled = false;
  }

  function renderPills() {
    const existing = pillsBar.querySelectorAll('.pill');
    existing.forEach(p => p.remove());

    participants.forEach(({ id, name }) => {
      activeParticipants.add(id);
      const pill = document.createElement('button');
      pill.className = 'pill active';
      pill.dataset.pid = id;
      pill.innerHTML = `<span class="pill-dot"></span>${name}`;
      pill.addEventListener('click', () => {
        if (activeParticipants.has(id)) {
          if (activeParticipants.size === 1) return; // keep at least one
          activeParticipants.delete(id);
          pill.classList.remove('active');
        } else {
          activeParticipants.add(id);
          pill.classList.add('active');
        }
      });
      pillsBar.appendChild(pill);
    });
  }

  // ── Send message ───────────────────────────────────────────

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || streaming) return;

    streaming = true;
    streamingBubbles = {};
    sendBtn.disabled = true;
    inputEl.value = '';
    autoResizeInput();

    emptyState.style.display = 'none';
    renderUserMessage(text);

    try {
      const response = await fetch('/api/discussion/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sessionId,
          message: text,
          participantIds: [...activeParticipants]
        })
      });

      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      await readStream(response);
    } catch (e) {
      renderError('Network error: ' + e.message);
    } finally {
      // Finalize any still-open bubbles (safety net)
      Object.values(streamingBubbles).forEach(({ cursorEl }) => {
        if (cursorEl && cursorEl.parentNode) cursorEl.remove();
      });
      streaming = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  async function readStream(response) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        const trimmed = line.trim();
        if (trimmed.startsWith('data:')) {
          const raw = trimmed.slice(5).trim();
          if (raw) handleEvent(JSON.parse(raw));
        }
      }
    }
  }

  function handleEvent({ participantId, participantName, type, content }) {
    if (type === 'token') {
      if (!streamingBubbles[participantId]) {
        streamingBubbles[participantId] = createAiBubble(participantId, participantName);
      }
      appendToken(streamingBubbles[participantId], content);
      scrollDown();
    } else if (type === 'done') {
      if (streamingBubbles[participantId]) {
        const { cursorEl } = streamingBubbles[participantId];
        if (cursorEl && cursorEl.parentNode) cursorEl.remove();
        delete streamingBubbles[participantId];
      }
    } else if (type === 'error') {
      if (!streamingBubbles[participantId]) {
        streamingBubbles[participantId] = createAiBubble(participantId, participantName);
      }
      const { contentEl, cursorEl } = streamingBubbles[participantId];
      if (cursorEl && cursorEl.parentNode) cursorEl.remove();
      const err = document.createElement('span');
      err.style.cssText = 'color:#e05555;font-style:italic';
      err.textContent = '⚠ ' + (content || 'Unknown error');
      contentEl.appendChild(err);
      delete streamingBubbles[participantId];
    }
  }

  // ── DOM helpers ────────────────────────────────────────────

  function renderUserMessage(text) {
    const wrap = document.createElement('div');
    wrap.className = 'message user';

    const header = document.createElement('div');
    header.className = 'msg-header';
    header.textContent = 'You';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;

    wrap.appendChild(header);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    scrollDown();
  }

  function createAiBubble(pid, name) {
    const pName = name || pid;
    const initial = pName.charAt(0).toUpperCase();

    const wrap = document.createElement('div');
    wrap.className = 'message ai';
    wrap.dataset.pid = pid;

    const header = document.createElement('div');
    header.className = 'msg-header';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = initial;

    const nameEl = document.createElement('span');
    nameEl.className = 'msg-name';
    nameEl.textContent = pName;

    header.appendChild(avatar);
    header.appendChild(nameEl);

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    const contentEl = document.createElement('span');
    const cursorEl = document.createElement('span');
    cursorEl.className = 'cursor';

    bubble.appendChild(contentEl);
    bubble.appendChild(cursorEl);

    wrap.appendChild(header);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);

    return { wrap, contentEl, cursorEl };
  }

  function appendToken({ contentEl }, text) {
    const parts = text.split('\n');
    parts.forEach((part, i) => {
      if (i > 0) contentEl.appendChild(document.createElement('br'));
      if (part) contentEl.appendChild(document.createTextNode(part));
    });
  }

  function renderError(msg) {
    const div = document.createElement('div');
    div.style.cssText = 'color:#e05555;font-size:0.82rem;padding:8px 0;text-align:center';
    div.textContent = msg;
    messagesEl.appendChild(div);
    scrollDown();
  }

  function scrollDown() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── Input auto-resize ──────────────────────────────────────

  function autoResizeInput() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  }

  inputEl.addEventListener('input', autoResizeInput);

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  document.getElementById('new-session-btn').addEventListener('click', async () => {
    if (streaming) return;
    const res = await fetch('/api/discussion/sessions', { method: 'POST' });
    const { sessionId: sid } = await res.json();
    sessionId = sid;
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyState);
    emptyState.style.display = '';
  });

  init();
</script>
</body>
</html>
