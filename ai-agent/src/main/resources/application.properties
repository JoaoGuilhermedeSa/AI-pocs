spring.application.name=ai-agent
server.port=8080

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3.5:9b
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.chat.options.num-predict=4096

# SearXNG (run: docker run -d -p 8081:8080 --name searxng searxng/searxng)
agent.searxng.url=http://localhost:8081
agent.searxng.max-results=5

# Safety guardrails
agent.safety.max-iterations=20
agent.safety.max-fetch-per-minute=15
agent.safety.url-blocklist=

# Web fetching
agent.web.max-content-chars=10000
agent.web.timeout-seconds=10

spring.codec.max-in-memory-size=10MB
